# Automatically commits new image tags to main (directly, no PR). Patches ONLY the marker
# comment in k8s/02-app.yaml (# {"$imagepolicy": "flux-system:studylife-telegram"}), not the
# rest of k8s/. "[skip ci]" in the commit template is MANDATORY - without it, a plain
# image-tag commit (no app code changed) would still trigger the entire CI pipeline again for
# no reason.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: studylife-telegram
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: studylife-telegram
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@studylife.local
        name: fluxcdbot
      messageTemplate: |
        chore(image): auto-update [skip ci]
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{- range $_, $change := $changes }}
            {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{- end }}
        {{ end -}}
  update:
    path: ./k8s
    strategy: Setters
