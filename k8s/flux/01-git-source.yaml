# Points Flux at this repo. No secretRef: the repo is public and every other GitRepository in
# this cluster (studylife, studylife-webhooks, studylife-ai, homelab-infra, ...) reads
# anonymously too. An earlier version of this file referenced a "studylife-git-auth" secret in
# flux-system - that secret does not exist, and a GitRepository pointing at a missing secret
# never becomes Ready, so nothing would have reconciled at all.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: studylife-telegram
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/lukislp/studylife-telegram.git
  ref:
    branch: main
