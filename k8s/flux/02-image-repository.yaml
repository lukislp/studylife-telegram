# Scans GHCR for new tags of this repo's image (.github/workflows/ci.yml "docker" job). This
# repo itself is private, but - matching studylife-developers'/studylife-webhooks' own
# convention - the built image package should be set to public visibility on GHCR (compiled
# artifact only, no source) once it exists, so this needs no secretRef here and the Deployment
# (k8s/02-app.yaml) needs no imagePullSecrets. Do this once via the package's GitHub Settings
# page after the first successful "docker" job run.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: studylife-telegram
  namespace: flux-system
spec:
  image: ghcr.io/lukislp/studylife-telegram
  interval: 5m
