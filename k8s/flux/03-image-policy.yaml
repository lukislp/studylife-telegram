# Selects the "newest" tag by SemVer - this repo's own .releaserc.json pushes plain SemVer
# tags without a "v" prefix via semantic-release, which Flux's standard SemVer policy parses
# directly. Deliberately unrestricted (>=0.0.0), not >=1.0.0 - kept pre-1.0 until reliable,
# same convention as studylife-alexa's seeded v0.1.0.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: studylife-telegram
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: studylife-telegram
  policy:
    semver:
      range: ">=0.0.0"
