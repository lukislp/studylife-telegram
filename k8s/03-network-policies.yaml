# Default-deny ingress baseline; egress stays open (outgoing calls to Telegram's Bot API and
# StudyAtrium's own API, same open-egress strategy as every other StudyAtrium add-on's own
# network-policies file). Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole
# (studylife repo's k8s/flux/06-reconciler-rbac.yaml) has no "networkpolicies" permission.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: studylife-telegram
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: studylife-telegram
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - {} # egress otherwise unrestricted - this policy only adds an explicit DNS allowance
---
# Lets the Tailscale operator's ingress proxy (k8s/04-tailscale-funnel.yaml, a single-replica
# StatefulSet the operator creates in its own "tailscale" namespace, not this one) reach the
# pod - the ONLY path that can make this service reachable from outside the tailnet. Mirrors
# studylife-alexa's own allow-tailscale-to-studylife-alexa rule exactly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-to-studylife-telegram
  namespace: studylife-telegram
spec:
  podSelector: { matchLabels: { app: studylife-telegram } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: tailscale } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Lets StudyAtrium's own server pods call POST /internal/users/{id}/purge when a user deletes
# their account. Cluster-internal on purpose: the route is not on the funnel
# (k8s/04-tailscale-funnel.yaml) and this is the only in-cluster path to it. The server runs in
# the studylife-scale namespace (studylife repo k8s/04-web.yaml, k8s/05-worker.yaml); the
# worker is included in case the outbox that delivers the call is hosted there.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-studylife-server-to-studylife-telegram
  namespace: studylife-telegram
spec:
  podSelector: { matchLabels: { app: studylife-telegram } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [studylife-web, studylife-worker] }
      ports:
        - { protocol: TCP, port: 8000 }
        # HTTPS listener (tls.py, STUDYLIFE_TELEGRAM_TLS_PORT) - the port StudyAtrium's
        # AddonPurge__Telegram__BaseUrl uses once it calls over TLS. 8000 stays allowed until that
        # switch is live and can be dropped afterwards.
        - { protocol: TCP, port: 8443 }
