# Deliberately ONLY this file - NOT the rest of k8s/. Mirrors every other StudyLife add-on's
# own k8s/flux-deploy/kustomization.yaml scoping: kustomize-controller's least-privilege
# ClusterRole (studylife repo's k8s/flux/06-reconciler-rbac.yaml) only grants permissions on
# Deployments/ConfigMaps/Services - NOT Namespaces, Secrets, NetworkPolicies, or the Ingress
# resource kind, all of which this repo's k8s/ also has (00-namespace.yaml, 01-secret.yaml,
# 03-network-policies.yaml, 04-tailscale-funnel.yaml). Those stay bootstrap-only, applied once
# by hand; Flux continuously reconciles exactly this subset.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../02-app.yaml
