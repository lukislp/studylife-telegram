# All values below are placeholders - real values must never be committed. Fill them in
# directly with kubectl, never via git.
#
# TELEGRAM_BOT_TOKEN authenticates every outgoing Bot API call. Telegram puts it in the URL
# path rather than a header, so it appears in any logged request URL - see telegram_client.redact.
#
# TELEGRAM_WEBHOOK_SECRET is the token passed to setWebhook, which Telegram echoes back in
# X-Telegram-Bot-Api-Secret-Token on every delivery. Telegram does NOT sign its requests, so this
# shared secret is the entire authentication of the public /telegram endpoint - generate it with
# real entropy and treat it like a password.
#
# TELEGRAM_ALLOWED_CHAT_IDS is the comma-separated list of chats allowed to use the bot at all.
# Not cryptographically secret, but kept here rather than in a ConfigMap because it is the second
# half of the access control and belongs next to the secret it complements. The service refuses
# to start if it parses to an empty set, unless TELEGRAM_ALLOW_ANY_CHAT is explicitly "true".
#
# LINK_ENCRYPTION_KEY encrypts the per-chat StudyLife API keys inside links.db on the persistent
# volume (store.py). That volume is backed up off-site by Velero, so without this a backup would
# be a list of live credentials. Generate with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# Rotating it does not corrupt anything, but every chat has to /login again.
#
# There is no STUDYLIFE_API_KEY any more: each chat connects its own account with /login, and
# the key is stored per chat rather than process-wide.
#
# STUDYLIFE_WEBHOOK_SECRET is the HMAC-SHA256 secret StudyLife signs each webhook delivery with -
# only needed for the StudyLife -> Telegram direction (session events, goal reminders).
#
# Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole (studylife repo's
# k8s/flux/06-reconciler-rbac.yaml) grants no permission on the "secrets" resource at all.
# Applied once by hand (kubectl apply -f k8s/01-secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: studylife-telegram-secrets
  namespace: studylife-telegram
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "REPLACE-ME"
  TELEGRAM_WEBHOOK_SECRET: "REPLACE-ME"
  TELEGRAM_ALLOWED_CHAT_IDS: "REPLACE-ME"
  STUDYLIFE_BASE_URL: "REPLACE-ME"
  LINK_ENCRYPTION_KEY: "REPLACE-ME"
  STUDYLIFE_WEBHOOK_SECRET: "REPLACE-ME"
  PUBLIC_BASE_URL: "REPLACE-ME"
