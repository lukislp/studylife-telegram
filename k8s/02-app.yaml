# The service itself. Image tag is a placeholder overwritten by Flux's
# ImageUpdateAutomation (k8s/flux/04-image-update-automation.yaml) the moment it first
# reconciles against a real published tag - mirrors every other StudyLife add-on's own
# k8s/*-app.yaml. This repo's Dockerfile creates "appuser" with an explicit numeric
# --uid 1000, so runAsNonRoot/runAsUser is safe here without live inspection.
#
# No PersistentVolumeClaim, unlike studylife-alexa/studylife-mcp/studylife-webhooks - this
# bot holds no SQLite store at all (see Dockerfile's own comment); the single StudyLife API
# key and both Telegram credentials live purely in the Secret above. Fully stateless, so
# RollingUpdate (the default strategy) is fine, and multiple replicas would be too if ever
# needed - not done here since a personal-use bot never needs more than one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studylife-telegram
  namespace: studylife-telegram
spec:
  replicas: 1
  selector:
    matchLabels: {app: studylife-telegram}
  template:
    metadata:
      labels: {app: studylife-telegram}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: studylife-telegram
          image: ghcr.io/lukislp/studylife-telegram:0.1.0 # {"$imagepolicy": "flux-system:studylife-telegram"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          envFrom:
            - secretRef: {name: studylife-telegram-secrets}
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: studylife-telegram
  namespace: studylife-telegram
spec:
  type: ClusterIP
  selector: {app: studylife-telegram}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
