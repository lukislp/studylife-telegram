# The service itself. The image tag is written by the deploy-bump job in CI on every release.
# This repo's Dockerfile creates "appuser" with an explicit numeric --uid 1000, so
# runAsNonRoot/runAsUser is safe here without live inspection.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studylife-telegram-data
  namespace: studylife-telegram
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml) rather than
  # the cluster default local-path: links.db is what connects each chat to a StudyLife account,
  # and losing it means everyone has to /login again.
  storageClassName: longhorn
  resources:
    requests: {storage: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studylife-telegram
  namespace: studylife-telegram
spec:
  replicas: 1
  strategy:
    # Single instance with an RWO volume - links.db is a plain SQLite file (store.py), not built
    # for concurrent writers. Same reasoning as studylife-mcp.
    type: Recreate
  selector:
    matchLabels: {app: studylife-telegram}
  template:
    metadata:
      labels: {app: studylife-telegram}
      annotations:
        # Opt-in to homelab-infra's nightly Velero PVC backup. The API keys inside links.db are
        # Fernet-encrypted (store.py) precisely because this volume leaves the cluster.
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Makes the PVC mount group-writable by UID 1000 on first mount - without this a
        # freshly-provisioned PersistentVolume is root-owned and the non-root container gets
        # "Permission denied" writing to /app/data/links.db.
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: studylife-telegram
          image: ghcr.io/lukislp/studylife-telegram:1.2.7 # set by the deploy-bump job (CI) on every release
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            # StudySessionDto.StartTime/EndTime are the server's LOCAL wall clock with no offset
            # in the JSON (SessionService deliberately uses DateTime.Now, see the comment on
            # GetHistoryAsync). studylife-web runs Europe/Berlin, so this pod has to agree or
            # every session reminder would fire two hours off. reminders.py does not rely on
            # this alone - it converts explicitly via STUDYLIFE_TIMEZONE - but keeping the
            # container clock in the same zone means logs and timestamps read the same too.
            - {name: TZ, value: Europe/Berlin}
          envFrom:
            - secretRef: {name: studylife-telegram-secrets}
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: studylife-telegram-data}
---
apiVersion: v1
kind: Service
metadata:
  name: studylife-telegram
  namespace: studylife-telegram
spec:
  type: ClusterIP
  selector: {app: studylife-telegram}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
