# Weekly Dependabot updates: GitHub Actions, uv (pyproject + uv.lock) and the Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # A new release waits three days before Dependabot proposes it, except the lktec-bot
    # workflows: those are our own and a fix there should reach every caller right away.
    cooldown:
      default-days: 3
      exclude:
        - "lukislp/lktec-bot*"
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # Same for the lktec-bot workflows (automerge, lockfiles, release): one PR per release.
      lktec-bot:
        patterns:
          - "lukislp/lktec-bot*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(docker)"
    # The Python base image tracks the version the add-on is tested on; minor and major
    # bumps (3.12 -> 3.14) are a deliberate change, patch tags still come through.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
