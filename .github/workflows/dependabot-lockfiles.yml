name: Dependabot lock files

# Thin caller of the shared implementation in lukislp/ci-workflows: regenerates the lock files
# on Dependabot's own PRs with the CI tool versions and pushes them back onto the PR branch.
# Plain pull_request on purpose (never pull_request_target); AUTOMERGE_TOKEN is stored as a
# Dependabot secret, which only Dependabot-triggered runs can read.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lockfiles:
    uses: lukislp/ci-workflows/.github/workflows/dependabot-lockfiles.yml@15935a731f004b846ccd894eb4b00f86e522998b # v1.7.23
    with:
      uv-version: "0.12.18"
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
      DEPLOY_SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
