name: Dependabot lock files

# Thin caller of the lockfiles workflow of lukislp/lktec-bot (a GitHub App): on a Dependabot pull
# request the lock files are regenerated with the CI tool versions and committed back onto the
# pull request branch by the App (GitHub signs that commit itself). The triggers stay here
# because a reusable workflow cannot declare them for the caller. See docs/modules/lockfiles.md
# in lukislp/lktec-bot; the policy lives in .github/lktec-bot.yml on the default branch.
#
# pull_request_target on purpose: the App id and key are ordinary Actions secrets. The pull
# request's code only ever runs in the job without a secret.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read # the reusable workflow reads which commit of itself the run uses

jobs:
  lockfiles:
    uses: lukislp/lktec-bot/.github/workflows/lockfiles.yml@dd3131cb2f1ac193e3b50a4e8cb1c1547ec69b9b # v0.10.0
    with:
      uv-version: "0.12.18"
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}
