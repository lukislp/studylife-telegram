name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/lukislp/studylife-telegram

# Least-privilege default for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# jobs that need more declare it themselves.
permissions:
  actions: read
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
          cache-suffix: "lint"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    # No oscrypto/OpenSSL-version regex bug here (that only affects ask-sdk-
    # webservice-support's cert-chain verifier, a studylife-alexa-only dependency) -
    # ubuntu-latest is fine for this repo's dependency set (PyNaCl, httpx, FastAPI).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
          cache-suffix: "test"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest

  # ---------------------------------------------------------------------
  # Version / image / release - push to main only, mirrors studylife-alexa's/
  # studylife-webhooks' own ci.yml pattern: the lktec-bot release module drives the version
  # (get-version is its dry run, release creates the tag), the deploy-bump job writes the
  # resulting tag into k8s/, and Flux reconciles it from there.
  # ---------------------------------------------------------------------
  get-version:
    needs: [lint, test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: lukislp/lktec-bot/.github/workflows/release.yml@ba6a835404962f464956ae8d4d05309e97b882c2 # v0.1.2
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  docker:
    needs: [get-version, release]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            PACKAGE_VERSION=${{ env.NEXT_VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          # Supply chain (2026-09-11 hardening): BuildKit attaches a SLSA provenance attestation
          # (which commit/workflow built this, from which base image) and an SPDX SBOM to every
          # per-arch image. They travel as extra "unknown/unknown" platform entries inside the
          # pushed index - GHCR shows them as such, containerd/k3s ignore them when pulling,
          # Trivy resolves the real linux/amd64 entry. imagetools create below carries them into
          # the multi-arch manifest unchanged.
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    needs: [get-version, docker]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # OIDC token for Sigstore keyless signing (cosign sign below) - no key material anywhere.
      id-token: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"
      # Sigstore keyless signature on the multi-arch manifest DIGEST (2026-09-11 hardening), so
      # every tag pointing at it (version, latest, sha-) is covered by one signature. The
      # signing identity is this workflow's OIDC certificate (repo + workflow path + ref), the
      # signature and the transparency-log entry live next to the image in GHCR. The verify
      # step right after is the live proof for this run and the exact identity constraint Flux
      # will use once its ImagePolicy verification is switched on (cluster phase).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the multi-arch manifest (Sigstore keyless) and verify
        env:
          IDENTITY_REGEXP: '^https://github\.com/lukislp/studylife-telegram/\.github/workflows/ci\.yml@refs/heads/main$'
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE }}@${DIGEST}" --output text >/dev/null
          echo "signed and verified ${{ env.IMAGE }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  trivy:
    needs: [get-version, docker-manifest-merge]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            *.blob.core.windows.net:443
            check.trivy.dev:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:22
            github.com:443
            *.githubapp.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Gate on CRITICAL
        # A CRITICAL finding with an available fix blocks the rollout (deploy-bump needs this job);
        # unfixed ones are reported above but cannot be acted on yet.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The image tag bump of the deploy manifests, committed onto the default branch by the lktec-bot App
  # (module sync: docs/modules/sync.md in lukislp/lktec-bot; the App is a bypass actor of the branch ruleset
  # for this one commit, which GitHub signs itself). Flux picks the new tag up from the branch.
  deploy-bump:
    needs: [get-version, release, docker-manifest-merge, trivy]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    concurrency:
      group: studylife-telegram-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/deploy-bump.yml@38079b17498fcfda986f427fd6258bd32185e7c3 # v0.2.0
    with:
      version: ${{ needs.release.outputs.version }}
      images: 'ghcr\.io/lukislp/(studylife-telegram)'
      paths: k8s
      branch: main
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  release:
    needs: [get-version]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@ba6a835404962f464956ae8d4d05309e97b882c2 # v0.1.2
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}
